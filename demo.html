<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Black Egg</title>

  <link rel="stylesheet" href="./css/demo.css">
  <script src="./js/demo.js" defer></script>
</head>

<body>
  <main class="egg-demo">
    <figure
      class="liquid-egg"
      id="liquid-egg"
      aria-label="바닥에 놓여 부화 직전처럼 미세하게 떨리는 검은 액체 질감의 타원형"
    >
      <div class="egg-fallback" aria-hidden="true"></div>

      <canvas class="egg-canvas" aria-hidden="true"></canvas>

    

      <figcaption class="egg-status" role="status"></figcaption>
    </figure>
  </main>
</body>
</html>
